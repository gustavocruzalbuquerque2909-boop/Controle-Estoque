<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho com botão de sair -->
        <div class="header-sistema">
            <h1>Painel de Estoque</h1>
            <a href="tela.html" class="btn-voltar">← Sair para a Tela Inicial</a>
        </div>

        <!-- Cartão de Cadastro/Edição -->
        <div class="card">
            <h2>Cadastrar / Editar Produto</h2>
            <form id="form-produto">
                <input type="hidden" id="produto-id">
                
                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico RGB">
                </div>
                
                <div class="form-group">
                    <label for="preco">Preço (R$):</label>
                    <input type="number" id="preco" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="quantidade">Quantidade em Estoque:</label>
                    <input type="number" id="quantidade" required placeholder="0">
                </div>
                
                <div class="form-group">
                    <label for="categoriaId">Categoria:</label>
                    <select id="categoriaId" required>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fornecedorId">Fornecedor:</label>
                    <select id="fornecedorId" required>
                        <option value="">Carregando fornecedores...</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-salvar">Salvar Produto</button>
            </form>
        </div>

        <!-- Cartão da Tabela de Produtos -->
        <div class="card">
            <h2>Lista de Produtos no Estoque</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Qtd. Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
